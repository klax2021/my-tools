name: Rules Update Cron

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache mihomo
        uses: actions/cache@v4
        with:
          path: ~/.cache/mihomo
          key: mihomo-v1.19.21-linux-amd64

      - name: Install mihomo
        run: |
          mkdir -p ~/.cache/mihomo
          if [ ! -f ~/.cache/mihomo/mihomo ]; then
            echo "Cache miss, downloading mihomo..."
            curl -L -o ~/.cache/mihomo/mihomo.gz \
              https://github.com/MetaCubeX/mihomo/releases/download/v1.19.21/mihomo-linux-amd64-v1-v1.19.21.gz
            gunzip ~/.cache/mihomo/mihomo.gz
            chmod +x ~/.cache/mihomo/mihomo
          else
            echo "Cache hit, skip download"
          fi
          sudo ln -sf ~/.cache/mihomo/mihomo /usr/local/bin/mihomo

      - name: Verify mihomo
        run: mihomo -v

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Generate Rules
        run: python tools/generate.py

      - name: Update Readme Stats
        run: python tools/update_readme.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/ README.md rules_build_stats.json
          if git diff --staged --quiet; then
            echo "No changes, skipping commit"
          else
            git commit -m "chore: auto update rules and readme stats"
            git push
          fi

      - name: Clean Old Rules Update Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 5
