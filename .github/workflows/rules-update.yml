name: Rules Update (合并去广告排除白名单)

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 缓存 mihomo（仍然保留，加速）
      - name: Cache mihomo
        uses: actions/cache@v4
        with:
          path: ~/.cache/mihomo
          key: mihomo-v1.19.21-linux-amd64

      # 下载并安装 mihomo（确保 PATH 可用）
      - name: Install mihomo
        run: |
          mkdir -p ~/.cache/mihomo
          if [ ! -f ~/.cache/mihomo/mihomo ]; then
            echo "Cache miss, downloading mihomo..."
            curl -L -o ~/.cache/mihomo/mihomo.gz \
              https://github.com/MetaCubeX/mihomo/releases/download/v1.19.21/mihomo-linux-amd64-v1-v1.19.21.gz
            gunzip ~/.cache/mihomo/mihomo.gz
            chmod +x ~/.cache/mihomo/mihomo
          else
            echo "Cache hit, skip download"
          fi
          # 关键：放入 PATH
          sudo ln -sf ~/.cache/mihomo/mihomo /usr/local/bin/mihomo

      # 验证 mihomo
      - name: Verify mihomo
        run: mihomo -v

      # Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      # 生成规则（Adblock 全量/精简 YAML + CDN 带注释 YAML，
      # 白名单按域名层级关系判断：完整覆盖才自动剔除，部分重叠转入
      # suspicious_review.yaml 供人工复核；脚本内部已完成全部 MRS 转换）
      - name: 生成规则 (Adblock + CDN)
        run: python tools/generate.py

      # 更新 README 统计
      - name: 更新 README 统计
        run: python tools/update_readme.py

      # 提交（rules/ 目录下含 yaml、mrs、removed_domains.yaml、
      # suspicious_review.yaml，以及 README.md 统计）
      - name: Commit & Push 更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/ README.md
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 自动更新规则与 README 统计"
            git push
          fi

      # 运行完毕后清理旧日志，保持仓库整洁
      - name: Clean Old Rules Update Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 5
