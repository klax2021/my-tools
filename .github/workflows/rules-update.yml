name: Rules Update (Adblock + CDN)

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 缓存 mihomo（仍然保留，加速）
      - name: Cache mihomo
        uses: actions/cache@v4
        with:
          path: ~/.cache/mihomo
          key: mihomo-v1.19.21-linux-amd64

      # ✅ 下载并安装 mihomo（确保 PATH 可用）
      - name: Install mihomo
        run: |
          mkdir -p ~/.cache/mihomo
          if [ ! -f ~/.cache/mihomo/mihomo ]; then
            echo "Cache miss, downloading mihomo..."
            curl -L -o ~/.cache/mihomo/mihomo.gz \
              https://github.com/MetaCubeX/mihomo/releases/download/v1.19.21/mihomo-linux-amd64-v1-v1.19.21.gz
            gunzip ~/.cache/mihomo/mihomo.gz
            chmod +x ~/.cache/mihomo/mihomo
          else
            echo "Cache hit, skip download"
          fi
          # ✅ 关键：放入 PATH
          sudo ln -sf ~/.cache/mihomo/mihomo /usr/local/bin/mihomo

      # 验证 mihomo
      - name: Verify mihomo
        run: mihomo -v

      # Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      # 生成规则
      - name: 生成规则 (Adblock + CDN)
        run: python tools/generate.py

      # 转换广告规则
      - name: 转换广告 YAML → MRS
        run: |
          echo "=== 转换 Full ==="
          mihomo convert-ruleset domain yaml rules/adblock-clean-full.yaml rules/adblock-clean-full.mrs

          echo "=== 转换 Lite ==="
          mihomo convert-ruleset domain yaml rules/adblock-clean-lite.yaml rules/adblock-clean-lite.mrs

      # 转换 CDN
      - name: 转换 CDN TXT → MRS
        run: |
          echo "=== 转换 CDN ==="
          mihomo convert-ruleset domain text rules/cdn.txt rules/cdn.mrs

      # 👇 新增：更新 README 统计
      - name: 更新 README 统计
        run: python tools/update_readme.py

      # 提交（注意：现在也提交 README.md）
      - name: Commit & Push 更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/ README.md
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 自动更新规则与 README 统计"
            git push
          fi
